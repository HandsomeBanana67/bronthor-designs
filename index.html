<!-- SHIPPING -->

<label>
    How far are you from Belmont North NSW 2280?
</label>

<select id="shipping" name="Driving Time / Shipping" required>

    <option value="" data-price="0">
        Select your driving distance
    </option>

    <option value="0 - 1 hour drive" data-price="5">
        0 - 1 hour drive (+$5.00)
    </option>

    <option value="1 - 3 hour drive" data-price="8">
        1 - 3 hour drive (+$8.00)
    </option>

    <option value="3 - 5 hour drive" data-price="12">
        3 - 5 hour drive (+$12.00)
    </option>

    <option value="5+ hour drive" data-price="15">
        5+ hour drive (+$15.00)
    </option>

</select>


<!-- TOTALS -->

<div class="total">
    Items Total:
    $<span id="itemsTotal">0.00</span>
</div>

<div class="total">
    Shipping:
    $<span id="shippingTotal">0.00</span>
</div>

<div class="order-total">
    ORDER TOTAL:
    $<span id="orderTotal">0.00</span>
</div>


<script>

function updateTotal() {

    // Get the total price of products
    let itemsTotal = getItemsTotal();

    // Get the selected shipping option
    const shippingSelect =
        document.getElementById("shipping");

    const selectedOption =
        shippingSelect.options[
            shippingSelect.selectedIndex
        ];

    // Get the shipping price
    let shipping =
        parseFloat(
            selectedOption.getAttribute("data-price")
        ) || 0;

    // Add shipping to the product total
    let orderTotal =
        itemsTotal + shipping;

    // Display product total
    document.getElementById("itemsTotal").textContent =
        itemsTotal.toFixed(2);

    // Display shipping
    document.getElementById("shippingTotal").textContent =
        shipping.toFixed(2);

    // Display final total
    document.getElementById("orderTotal").textContent =
        orderTotal.toFixed(2);
}


// Update total whenever customer changes
// their driving distance

document.getElementById("shipping").addEventListener(
    "change",
    updateTotal
);


// Update when the page first loads

updateTotal();

</script>
