<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bronthor Designs</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 25px;
}

h1 {
  text-align: center;
  font-size: 34px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 30px;
}

/* PRODUCTS */

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 15px;
}

.product {
  background: #181818;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 18px;
}

.product h2 {
  font-size: 19px;
  margin-top: 0;
}

.price {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 15px;
}

.add-button {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 8px;
  background: white;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

.add-button:hover {
  background: #ddd;
}

/* CART */

.cart {
  margin-top: 35px;
  background: white;
  color: black;
  border-radius: 15px;
  padding: 22px;
}

.cart h2 {
  margin-top: 0;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 13px 0;
  border-bottom: 1px solid #ddd;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 7px;
}

.quantity button {
  border: none;
  background: #ddd;
  padding: 7px 11px;
  border-radius: 6px;
  cursor: pointer;
}

.remove {
  background: #111 !important;
  color: white;
}

.totals {
  margin-top: 20px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  margin: 8px 0;
}

.grand-total {
  border-top: 2px solid black;
  padding-top: 12px;
  font-size: 23px;
  font-weight: bold;
}

/* CHECKOUT */

label {
  display: block;
  font-weight: bold;
  margin-top: 18px;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #aaa;
  border-radius: 7px;
  font-size: 16px;
}

.checkout {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: black;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.checkout:hover {
  background: #333;
}

.empty {
  color: #777;
}

.note {
  color: #666;
  font-size: 13px;
  margin-top: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>BRONTHOR DESIGNS</h1>

<div class="subtitle">
From Imagination To Creation • Australian Dollars
</div>

<!-- PRODUCTS -->

<div class="products" id="products"></div>

<!-- CART -->

<div class="cart">

<h2>🛒 Your Cart</h2>

<div id="cartItems">
  <div class="empty">Your cart is empty.</div>
</div>

<div class="totals">

<div class="total-row">
<span>Subtotal</span>
<strong id="subtotal">$0.00 AUD</strong>
</div>

<div class="total-row">
<span>Shipping</span>
<strong id="shipping">$0.00 AUD</strong>
</div>

<div class="total-row grand-total">
<span>Total</span>
<strong id="total">$0.00 AUD</strong>
</div>

</div>

<!-- SHIPPING -->

<label for="shippingBand">
Shipping from Belmont North NSW 2280
</label>

<select id="shippingBand" onchange="updateCart()">

<option value="0">
Select your driving distance
</option>

<option value="5">
0–1 hour drive — $5.00
</option>

<option value="8">
1–3 hour drive — $8.00
</option>

<option value="12">
3–5 hour drive — $12.00
</option>

<option value="15">
5+ hour drive — $15.00
</option>

</select>

<div class="note">
Shipping is based on the driving-time band you select.
</div>

<!-- CUSTOMER DETAILS -->

<label for="name">
Full Name
</label>

<input
id="name"
type="text"
placeholder="Your name"
>

<label for="email">
Email
</label>

<input
id="email"
type="email"
placeholder="you@example.com"
>

<label for="address">
Delivery Address
</label>

<input
id="address"
type="text"
placeholder="Street, suburb, state and postcode"
>

<button class="checkout" onclick="placeOrder()">
Place Order
</button>

<div id="message" class="note"></div>

</div>

</div>

<script>

/* =========================
   BRONTHOR PRODUCTS
========================= */

const products = [

{
name: "Christus Statue",
price: 30.00
},

{
name: "Moroni Statue",
price: 30.00
},

{
name: "Spiral Fidget",
price: 5.50
},

{
name: "Rocktopus",
price: 8.00
},

{
name: "Articulated Legs Bookmark",
price: 3.00
},

{
name: "Articulated Dragon",
price: 25.00
},

{
name: "Flower Vase",
price: 10.00
},

{
name: "The 67 Family",
price: 6.70
},

{
name: "Bronthor Designs Keychain",
price: 1.00
}

];


/* =========================
   CART
========================= */

let cart =
JSON.parse(
localStorage.getItem("bronthorCart")
) || {};


/* =========================
   MONEY
========================= */

function money(amount) {

return "$" +
amount.toFixed(2) +
" AUD";

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts() {

const container =
document.getElementById("products");

container.innerHTML = "";

products.forEach((product, index) => {

container.innerHTML += `

<div class="product">

<h2>
${product.name}
</h2>

<div class="price">
${money(product.price)}
</div>

<button
class="add-button"
onclick="addToCart(${index})"
>

Add to Cart

</button>

</div>

`;

});

}


/* =========================
   ADD TO CART
========================= */

function addToCart(index) {

if (!cart[index]) {

cart[index] = 1;

} else {

cart[index]++;

}

saveCart();

updateCart();

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(index, amount) {

cart[index] += amount;

if (cart[index] <= 0) {

delete cart[index];

}

saveCart();

updateCart();

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index) {

delete cart[index];

saveCart();

updateCart();

}


/* =========================
   SAVE CART
========================= */

function saveCart() {

localStorage.setItem(
"bronthorCart",
JSON.stringify(cart)
);

}


/* =========================
   UPDATE CART
========================= */

function updateCart() {

const cartContainer =
document.getElementById("cartItems");

let subtotal = 0;

let html = "";


Object.keys(cart).forEach(index => {

const product =
products[index];

const quantity =
cart[index];

const itemTotal =
product.price * quantity;

subtotal += itemTotal;


html += `

<div class="cart-item">

<div>

<strong>
${product.name}
</strong>

<br>

${money(product.price)}
× ${quantity}

</div>


<div class="quantity">

<button
onclick="changeQuantity(${index}, -1)"
>
−
</button>

<strong>
${quantity}
</strong>

<button
onclick="changeQuantity(${index}, 1)"
>
+
</button>

<button
class="remove"
onclick="removeItem(${index})"
>
Remove
</button>

</div>

</div>

`;

});


if (html === "") {

html =
'<div class="empty">Your cart is empty.</div>';

}


cartContainer.innerHTML = html;


/* SHIPPING */

const shipping =
Number(
document.getElementById("shippingBand").value
);


/* TOTAL */

const total =
subtotal + shipping;


document.getElementById("subtotal")
.textContent =
money(subtotal);


document.getElementById("shipping")
.textContent =
shipping > 0
? money(shipping)
: "$0.00 AUD";


document.getElementById("total")
.textContent =
money(total);

}


/* =========================
   PLACE ORDER
========================= */

function placeOrder() {

if (
Object.keys(cart).length === 0
) {

alert(
"Please add something to your cart first."
);

return;

}


const name =
document.getElementById("name")
.value.trim();


const email =
document.getElementById("email")
.value.trim();


const address =
document.getElementById("address")
.value.trim();


const shipping =
Number(
document.getElementById("shippingBand")
.value
);


if (
!name ||
!email ||
!address ||
shipping === 0
) {

alert(
"Please complete your name, email, address and shipping distance."
);

return;

}


let subtotal = 0;

let orderItems = [];


Object.keys(cart).forEach(index => {

const product =
products[index];

const quantity =
cart[index];

const itemTotal =
product.price * quantity;

subtotal += itemTotal;


orderItems.push(
product.name +
" × " +
quantity +
" = " +
money(itemTotal)
);

});


const total =
subtotal + shipping;


const orderText = `

BRONTHOR DESIGNS ORDER

Customer:
${name}

Email:
${email}

Delivery Address:
${address}

ITEMS:

${orderItems.join("\n")}

Subtotal:
${money(subtotal)}

Shipping:
${money(shipping)}

TOTAL:
${money(total)}

`;


/* Copy order details */

navigator.clipboard
.writeText(orderText)
.then(() => {

document.getElementById("message")
.innerHTML =

"Your order summary has been copied. " +
"Payment and automatic order sending still need to be connected.";

})
.catch(() => {

alert(orderText);

});

}


/* =========================
   START WEBSITE
========================= */

displayProducts();

updateCart();

</script>

</body>
</html>
